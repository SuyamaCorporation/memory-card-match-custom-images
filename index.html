<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Card Match</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .card-wrap { perspective: 600px; }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,0,.2,1);
    cursor: pointer;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-inner.matched { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-front { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  .card-back { transform: rotateY(180deg); background: #fff; }
  .card-inner.matched .card-back { background: #d1fae5; }
  .card-wrap:focus .card-inner { box-shadow: 0 0 0 3px #6366f1; }
  #grid { display: grid; gap: 8px; justify-items: center; }
</style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-100 min-h-screen flex flex-col items-center p-4">
<div class="w-full max-w-xl">
  <h1 class="text-3xl font-bold text-center text-purple-800 mb-1">🃏 Memory Card Match</h1>
  <p class="text-center text-gray-500 text-sm mb-4">Flip and match pairs of emoji cards!</p>

  <!-- Controls -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4">
    <div class="flex flex-wrap gap-3 items-center justify-between">
      <div>
        <label for="difficulty" class="block text-xs font-semibold text-gray-500 mb-1">Difficulty</label>
        <select id="difficulty" class="border border-gray-300 rounded-lg px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" aria-label="Select difficulty">
          <option value="4">Easy (4 pairs)</option>
          <option value="8" selected>Medium (8 pairs)</option>
          <option value="12">Hard (12 pairs)</option>
        </select>
      </div>
      <div class="flex gap-4 text-center">
        <div>
          <div class="text-xs text-gray-400 font-semibold">TIME</div>
          <div id="timer" class="text-2xl font-bold text-purple-700 tabular-nums">0:00</div>
        </div>
        <div>
          <div class="text-xs text-gray-400 font-semibold">MOVES</div>
          <div id="moves" class="text-2xl font-bold text-purple-700 tabular-nums">0</div>
        </div>
        <div>
          <div class="text-xs text-gray-400 font-semibold">BEST</div>
          <div id="best" class="text-2xl font-bold text-green-600 tabular-nums">—</div>
        </div>
      </div>
      <button onclick="startGame()" class="px-5 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition shadow" aria-label="Start new game">New Game</button>
    </div>
    <div id="progress-bar-wrap" class="mt-3 bg-gray-100 rounded-full h-2">
      <div id="progress-bar" class="bg-purple-500 h-2 rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
  </div>

  <!-- Grid -->
  <div id="grid" class="mb-4" role="grid" aria-label="Memory card grid"></div>

  <!-- Win overlay -->
  <div id="win-banner" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50" role="dialog" aria-modal="true" aria-label="You won!">
    <div class="bg-white rounded-3xl shadow-2xl p-8 text-center max-w-sm mx-4">
      <div class="text-6xl mb-3">🎉</div>
      <h2 class="text-3xl font-bold text-purple-700 mb-2">You Win!</h2>
      <p class="text-gray-500 mb-1">Time: <span id="win-time" class="font-bold text-gray-700"></span></p>
      <p class="text-gray-500 mb-1">Moves: <span id="win-moves" class="font-bold text-gray-700"></span></p>
      <p id="win-best" class="text-green-600 font-semibold mb-4"></p>
      <button onclick="startGame(); document.getElementById('win-banner').classList.add('hidden')" class="px-8 py-3 bg-purple-600 text-white rounded-full font-bold hover:bg-purple-700 transition" aria-label="Play again">Play Again</button>
    </div>
  </div>
</div>

<script>
const allEmojis = [
  '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯',
  '🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦅',
  '🦉','🦇','🐺','🐗','🐴','🦄','🐝','🐛','🦋','🐌',
  '🐞','🐜','🦟','🦗','🦂','🐢','🦎','🐍','🦕','🦖',
  '🦕','🐙','🦑','🦐','🦞','🦀','🐡','🐠','🐟','🐬',
  '🌸','🌺','🌻','🌹','🌷','🍎','🍊','🍋','🍇','🍓'
];

let cards = [];
let flipped = [];
let matched = 0;
let moves = 0;
let locked = false;
let timerInterval = null;
let seconds = 0;
let gameStarted = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startGame() {
  clearInterval(timerInterval);
  const pairs = parseInt(document.getElementById('difficulty').value);
  const emojis = shuffle(allEmojis).slice(0, pairs);
  cards = shuffle([...emojis, ...emojis]).map((e, i) => ({id: i, emoji: e, flipped: false, matched: false}));
  flipped = [];
  matched = 0;
  moves = 0;
  seconds = 0;
  locked = false;
  gameStarted = false;

  document.getElementById('moves').textContent = '0';
  document.getElementById('timer').textContent = '0:00';
  updateProgress(0, pairs);
  renderGrid(pairs);
  updateBestDisplay(pairs);
}

function renderGrid(pairs) {
  const grid = document.getElementById('grid');
  const total = pairs * 2;
  const cols = pairs === 4 ? 4 : pairs === 8 ? 4 : 6;
  const cellSize = pairs === 12 ? 'h-16 w-16' : 'h-20 w-20';
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';

  cards.forEach(card => {
    const wrap = document.createElement('div');
    wrap.className = `card-wrap ${cellSize}`;
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('role', 'gridcell');
    wrap.setAttribute('aria-label', `Card ${card.id + 1}, ${card.flipped || card.matched ? card.emoji : 'face down'}`);

    const inner = document.createElement('div');
    inner.className = 'card-inner';
    inner.id = `card-${card.id}`;

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    const pattern = document.createElement('span');
    pattern.textContent = '✦';
    pattern.className = 'text-white/40 text-2xl';
    front.appendChild(pattern);

    const back = document.createElement('div');
    back.className = 'card-face card-back';
    const emoji = document.createElement('span');
    emoji.textContent = card.emoji;
    emoji.className = pairs === 12 ? 'text-3xl' : 'text-4xl';
    back.appendChild(emoji);

    inner.appendChild(front);
    inner.appendChild(back);
    wrap.appendChild(inner);

    const toggle = () => flipCard(card.id);
    wrap.addEventListener('click', toggle);
    wrap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

    grid.appendChild(wrap);
  });
}

function flipCard(id) {
  if (locked) return;
  const card = cards[id];
  if (card.flipped || card.matched) return;
  if (flipped.length === 2) return;

  if (!gameStarted) {
    gameStarted = true;
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds/60);
      const s = seconds%60;
      document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
    }, 1000);
  }

  card.flipped = true;
  const inner = document.getElementById(`card-${id}`);
  inner.classList.add('flipped');
  const wrap = inner.parentElement;
  wrap.setAttribute('aria-label', `Card ${id+1}, ${card.emoji}`);

  flipped.push(id);

  if (flipped.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    locked = true;
    const [a, b] = flipped;
    if (cards[a].emoji === cards[b].emoji) {
      setTimeout(() => {
        cards[a].matched = cards[b].matched = true;
        document.getElementById(`card-${a}`).classList.add('matched');
        document.getElementById(`card-${b}`).classList.add('matched');
        flipped = [];
        locked = false;
        matched += 2;
        const pairs = parseInt(document.getElementById('difficulty').value);
        updateProgress(matched / 2, pairs);
        if (matched === cards.length) onWin(pairs);
      }, 400);
    } else {
      setTimeout(() => {
        cards[a].flipped = cards[b].flipped = false;
        document.getElementById(`card-${a}`).classList.remove('flipped');
        document.getElementById(`card-${b}`).classList.remove('flipped');
        document.getElementById(`card-${a}`).parentElement.setAttribute('aria-label', `Card ${a+1}, face down`);
        document.getElementById(`card-${b}`).parentElement.setAttribute('aria-label', `Card ${b+1}, face down`);
        flipped = [];
        locked = false;
      }, 900);
    }
  }
}

function updateProgress(matchedPairs, totalPairs) {
  const pct = totalPairs > 0 ? (matchedPairs / totalPairs * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function onWin(pairs) {
  clearInterval(timerInterval);
  const timeStr = document.getElementById('timer').textContent;
  document.getElementById('win-time').textContent = timeStr;
  document.getElementById('win-moves').textContent = moves;

  const key = `mem-best-${pairs}`;
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e) { prev = null; }
  let newBest = false;
  if (!prev || moves < prev.moves || (moves === prev.moves && seconds < prev.seconds)) {
    localStorage.setItem(key, JSON.stringify({moves, seconds}));
    newBest = true;
  }
  document.getElementById('win-best').textContent = newBest ? '🏆 New Best Score!' : `Best: ${prev ? prev.moves+' moves' : '—'}`;
  document.getElementById('win-banner').classList.remove('hidden');
}

function updateBestDisplay(pairs) {
  const key = `mem-best-${pairs}`;
  let best = null;
  try { best = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e) { best = null; }
  document.getElementById('best').textContent = best ? best.moves : '—';
}

document.getElementById('difficulty').addEventListener('change', () => {
  updateBestDisplay(parseInt(document.getElementById('difficulty').value));
});

startGame();
</script>
</body>
</html>
